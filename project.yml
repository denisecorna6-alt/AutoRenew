name: AutoRenew
options:
  bundleIdPrefix: app.autorenew
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
targets:
  AutoRenew:
    type: application
    platform: iOS
    sources: [Sources/App, Sources/Core, Sources/UI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.autorenew.AutoRenew
        INFOPLIST_KEY_CFBundleDisplayName: AutoRenew
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [app.autorenew.refresh, app.autorenew.processing]
        NSLocalNetworkUsageDescription: Necessário para comunicar com o próprio dispositivo.
  # Opcional (exige entitlement Network Extension, indisponível em conta gratuita).
  Tunnel:
    type: app-extension
    platform: iOS
    sources: [Sources/Tunnel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.autorenew.AutoRenew.Tunnel
    info:
      path: Tunnel-Info.plist
      properties:
        CFBundleDisplayName: AutoRenewTunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
