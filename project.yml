name: AutoRenew
options:
  bundleIdPrefix: app.autorenew
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
targets:
  AutoRenew:
    type: application
    platform: iOS
    sources:
      - path: .
        includes: ["*.swift"]
        excludes: ["PacketTunnelProvider.swift", "Tests/**", "InstallerView.swift", "InstallerApp.swift", "SigningIdentityVault.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.autorenew.AutoRenew
        INFOPLIST_KEY_CFBundleDisplayName: AutoRenew
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [app.autorenew.refresh, app.autorenew.processing]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  AutoRenewInstaller:
    type: application
    platform: iOS
    sources:
      - path: .
        includes: ["*.swift"]
        excludes: ["PacketTunnelProvider.swift", "Tests/**", "AutoRenewApp.swift", "ContentView.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.autorenew.Installer
        INFOPLIST_KEY_CFBundleDisplayName: AutoRenew Installer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Installer-Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  AutoRenewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AutoRenew
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.autorenew.AutoRenewTests
        GENERATE_INFOPLIST_FILE: YES
