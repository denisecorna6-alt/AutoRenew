name: AutoRenew Official IPA

on:
  push:
    branches: [main, codex/ipa-packaging-validation]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive unsigned official app
        run: |
          set -euo pipefail
          xcodebuild -project AutoRenew.xcodeproj -scheme AutoRenew -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/AutoRenew-Official.xcarchive -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Validate and package official IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/AutoRenew-Official.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -s "$APP_PATH/AutoRenew"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | grep -Fx 'app.autorenew.AutoRenew'
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist" | grep -Fx '17.0'
          file "$APP_PATH/AutoRenew"
          mkdir -p build/official/Payload
          ditto "$APP_PATH" build/official/Payload/AutoRenew.app
          (cd build/official && /usr/bin/zip -qry ../AutoRenew-Official-unsigned.ipa Payload)
          /usr/bin/unzip -t build/AutoRenew-Official-unsigned.ipa
          test "$(stat -f%z build/AutoRenew-Official-unsigned.ipa)" -gt 20000
          echo "IPA bytes: $(stat -f%z build/AutoRenew-Official-unsigned.ipa)"
          echo "Executable bytes: $(stat -f%z "$APP_PATH/AutoRenew")"
          echo "App bundle files:"
          find "$APP_PATH" -maxdepth 2 -type f -print
      - name: Upload Official IPA
        uses: actions/upload-artifact@v4
        with:
          name: AutoRenew-Official-unsigned-IPA
          path: build/AutoRenew-Official-unsigned.ipa
          if-no-files-found: error
          retention-days: 90
