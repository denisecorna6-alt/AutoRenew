name: AutoRenew Beta IPA

on:
  push:
    branches: [beta]
    tags: ['beta-v*']
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive unsigned iOS app
        run: |
          xcodebuild -project AutoRenew.xcodeproj -scheme AutoRenew -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/AutoRenew-Beta.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA for SideStore/AltStore signing
        run: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build/AutoRenew-Beta.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && /usr/bin/zip -qry ../AutoRenew-Beta-unsigned.ipa Payload)
      - name: Upload Beta IPA
        uses: actions/upload-artifact@v4
        with:
          name: AutoRenew-Beta-unsigned-IPA
          path: build/AutoRenew-Beta-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Publish public Beta pre-release
        if: startsWith(github.ref, 'refs/tags/beta-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/AutoRenew-Beta-unsigned.ipa --prerelease --title "AutoRenew ${GITHUB_REF_NAME} (Beta)" --notes "Build Beta experimental. IPA sem assinatura; importe no SideStore/AltStore para assinar com seu Apple ID. Pode conter bugs. Não é versão oficial."
