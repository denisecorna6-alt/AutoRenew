name: AutoRenew Beta IPA

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive unsigned iOS app
        run: |
          xcodebuild -project AutoRenew.xcodeproj -scheme AutoRenew -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/AutoRenew-Beta.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA for SideStore/AltStore signing
        run: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build/AutoRenew-Beta.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && /usr/bin/zip -qry ../AutoRenew-Beta-unsigned.ipa Payload)
      - name: Upload Beta IPA artifact (unsigned)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AutoRenew-Beta-unsigned-IPA
          path: build/AutoRenew-Beta-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      # Public pre-releases are deliberately not created by CI; use an
      # explicitly approved release process after device validation.