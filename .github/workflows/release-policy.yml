name: Release workflow safety policy
on:
  push:
    branches:
      - codex/alpha-release-approval-gate-20261031
    paths:
      - ".github/workflows/beta-ipa.yml"
      - ".github/workflows/official-ipa.yml"
      - ".github/workflows/release-policy.yml"
      - "Tests/test_release_workflow_policy.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/beta-ipa.yml"
      - ".github/workflows/official-ipa.yml"
      - ".github/workflows/release-policy.yml"
      - "Tests/test_release_workflow_policy.py"
permissions:
  contents: read
concurrency:
  group: release-policy
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Test release publishing safeguards
        run: python -m unittest Tests.test_release_workflow_policy -v
