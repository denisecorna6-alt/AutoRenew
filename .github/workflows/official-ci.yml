name: Official CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run repository regression and safety tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Select Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: xcodebuild -project AutoRenew.xcodeproj -scheme AutoRenew -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
