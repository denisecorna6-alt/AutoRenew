name: Official CI

on:
  push:
    branches: [main, 'codex/alpha-*']
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Validate shell helpers and Python tools
        run: |
          bash -n tools/install-to-iphone.sh
          bash -n tools/sign-ipa-macos.sh
          python3 -m py_compile tools/validate-signing-inputs.py tools/ai_central.py tools/ai_coder.py
          python3 -m unittest discover -s Tests -p 'test_*.py' -v

      - name: Smoke-test IPA archive round-trip preserves root resources
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          mkdir -p "$temp_dir/extracted/Payload/Demo.app" "$temp_dir/extracted/SwiftSupport"
          printf 'demo app metadata' > "$temp_dir/extracted/Payload/Demo.app/Info.plist"
          printf 'swift support payload' > "$temp_dir/extracted/SwiftSupport/libswift.dylib"
          ditto -c -k --sequesterRsrc "$temp_dir/extracted" "$temp_dir/roundtrip.ipa"
          mkdir "$temp_dir/repacked"
          ditto -x -k "$temp_dir/roundtrip.ipa" "$temp_dir/repacked"
          test -f "$temp_dir/repacked/Payload/Demo.app/Info.plist"
          test -f "$temp_dir/repacked/SwiftSupport/libswift.dylib"

      - name: Select Xcode and install XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Build AutoRenew for iOS Simulator
        run: |
          xcodebuild -project AutoRenew.xcodeproj -scheme AutoRenew \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Build AutoRenew Installer for iOS Simulator
        run: |
          xcodebuild -project AutoRenew.xcodeproj -scheme AutoRenewInstaller \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Run unit tests or compile test bundle when no simulator is available
        run: |
          if xcrun simctl list devices available | grep -q 'iPhone'; then
            DEVICE_ID="$(xcrun simctl list devices available | sed -nE 's/.*iPhone[^()]* \(([0-9A-F-]+)\).*/\1/p' | head -n 1)"
            if [[ -n "$DEVICE_ID" ]]; then
              xcodebuild test -project AutoRenew.xcodeproj -scheme AutoRenew \
                -destination "platform=iOS Simulator,id=$DEVICE_ID" \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
            else
              xcodebuild build-for-testing -project AutoRenew.xcodeproj -scheme AutoRenew \
                -destination 'generic/platform=iOS Simulator' \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
            fi
          else
            xcodebuild build-for-testing -project AutoRenew.xcodeproj -scheme AutoRenew \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          fi
