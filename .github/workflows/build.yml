name: Build AutoRenew + Installer IPAs
run-name: Build separate AutoRenew and Installer test packages
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/alpha-*'
concurrency:
  group: autorenew-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Validate macOS helper syntax and signing validator tests
        run: |
          bash -n tools/install-to-iphone.sh
          bash -n tools/sign-ipa-macos.sh
          python3 -m py_compile tools/validate-signing-inputs.py
          python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Build AutoRenew for iOS
        run: |
          xcodebuild -project AutoRenew.xcodeproj -scheme AutoRenew -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Build AutoRenew Installer for iOS
        run: |
          xcodebuild -project AutoRenew.xcodeproj -scheme AutoRenewInstaller -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Run AutoRenew unit tests when a simulator runtime is available
        run: |
          if xcrun simctl list devices available | grep -q 'iPhone'; then
            DEVICE_ID="$(xcrun simctl list devices available | sed -nE 's/.*iPhone[^()]* \(([0-9A-F-]+)\).*/\1/p' | head -n 1)"
            if [[ -n "$DEVICE_ID" ]]; then
              xcodebuild test -project AutoRenew.xcodeproj -scheme AutoRenew \
                -destination "platform=iOS Simulator,id=$DEVICE_ID" \
                -derivedDataPath test-build \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
            else
              echo "Nenhum iPhone Simulator concreto; compilando os testes sem executá-los."
              xcodebuild build-for-testing -project AutoRenew.xcodeproj -scheme AutoRenew \
                -destination 'generic/platform=iOS Simulator' \
                -derivedDataPath test-build \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
            fi
          else
            echo "Runtime de simulador indisponível; compilando os testes sem executá-los."
            xcodebuild build-for-testing -project AutoRenew.xcodeproj -scheme AutoRenew \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath test-build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          fi
      - name: Package both unsigned IPAs
        run: |
          mkdir -p AutoRenewPayload/Payload InstallerPayload/Payload
          cp -R build/Build/Products/Release-iphoneos/AutoRenew.app AutoRenewPayload/Payload/
          cp -R build/Build/Products/Release-iphoneos/AutoRenewInstaller.app InstallerPayload/Payload/
          (cd AutoRenewPayload && zip -qr ../AutoRenew.ipa Payload)
          (cd InstallerPayload && zip -qr ../AutoRenew-Installer.ipa Payload)
      - name: Upload AutoRenew unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AutoRenew-ipa-unsigned
          path: AutoRenew.ipa
          retention-days: 30
      - name: Upload Installer unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AutoRenew-Installer-ipa-unsigned
          path: AutoRenew-Installer.ipa
          retention-days: 30

      - name: Publish public Alpha prerelease
        if: startsWith(github.ref, 'refs/heads/codex/alpha-release-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 AutoRenew.ipa AutoRenew-Installer.ipa > SHA256SUMS
          cat > RELEASE_NOTES.md <<'EOF'
          # AutoRenew Alpha — teste público

          Esta versão Alpha é experimental e pode conter falhas.

          Downloads:
          - AutoRenew.ipa — aplicativo principal.
          - AutoRenew-Installer.ipa — Installer independente.
          - SHA256SUMS — hashes SHA-256 dos pacotes.

          IMPORTANTE: os dois IPAs são unsigned e não são instaláveis diretamente. Para testar, importe o IPA no AltStore ou SideStore e deixe essa ferramenta assinar o pacote com seu próprio método e perfil compatível. O Installer também precisa ser instalado por uma ferramenta de sideload já funcional.

          O AutoRenew ainda não implementa renovação/refresh real. O Installer oferece catálogo, download, pré-verificação estrutural e handoff; não faz assinatura ou instalação on-device por conta própria.

          Informe versão do iOS, modelo do dispositivo, versão do app e etapa do erro ao relatar problemas. Não use esta Alpha como versão de produção.
          EOF
          TAG="alpha-$(date -u +%Y.%m.%d)-${GITHUB_SHA:0:7}"
          gh release create "$TAG" AutoRenew.ipa AutoRenew-Installer.ipa SHA256SUMS \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "AutoRenew Alpha $TAG" \
            --notes-file RELEASE_NOTES.md
