name: AutoRenew AI Central
run-name: AI Central review
on:
  push:
    branches:
      - 'codex/alpha-*'
    paths:
      - '.github/workflows/ai-central.yml'
      - 'project.yml'
      - '**/*.swift'
      - 'tools/**'
      - 'Tests/**'
      - 'docs/**'
  pull_request:
    branches:
      - 'codex/alpha-*'
    paths:
      - '.github/workflows/ai-central.yml'
      - 'project.yml'
      - '**/*.swift'
      - 'tools/**'
      - 'Tests/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      task:
        description: 'Tarefa para as três IAs analisarem'
        required: true
        type: string
      context:
        description: 'Contexto adicional não secreto'
        required: false
        type: string
      mode:
        description: 'Modo de operação'
        required: true
        type: choice
        options:
          - review
          - implement
        default: review
      worker:
        description: 'IA que implementará o patch (as outras duas revisam)'
        required: false
        type: choice
        options:
          - openai
          - claude
          - gemini
        default: openai
      base_branch:
        description: 'Branch Alpha que receberá a PR gerada'
        required: false
        type: string
        default: codex/alpha-ai-orchestrator-20261031
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Compile orchestrator
        run: python -m py_compile tools/ai_central.py
      - name: Validate required workflow wiring
        run: |
          grep -q OPENAI_API_KEY .github/workflows/ai-central.yml
          grep -q ANTHROPIC_API_KEY .github/workflows/ai-central.yml
          grep -q GEMINI_API_KEY .github/workflows/ai-central.yml
          python -m unittest discover -s Tests -p 'test_ai_central.py' -v
  review:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'review'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Run three independent AI reviews
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_MODEL: gpt-6.1-sol
          ANTHROPIC_MODEL: claude-sonnet-5-5
          GEMINI_MODEL: gemini-3.8-flash
          AI_TASK: ${{ inputs.task }}
          AI_CONTEXT: ${{ inputs.context }}
        run: python tools/ai_central.py
      - name: Upload AI review report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ai-central-report
          path: ai-central-report.md
          retention-days: 14

  implement:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'implement'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verify the selected Alpha branch contains the AI central tools
        run: |
          test -f tools/ai_coder.py
          test -f tools/ai_central.py
          test -f .github/workflows/ai-central.yml
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Configure GitHub CLI authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth status
      - name: Run selected AI implementer and two independent reviewers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          OPENAI_MODEL: gpt-6.1-sol
          ANTHROPIC_MODEL: claude-sonnet-5-5
          GEMINI_MODEL: gemini-3.8-flash
          AI_TASK: ${{ inputs.task }}
          AI_WORKER: ${{ inputs.worker }}
          AI_BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          git switch -c "codex/alpha-ai-work-${GITHUB_RUN_ID}"
          python tools/ai_coder.py
      - name: Upload coding report
        if: always() && hashFiles('ai-coding-report.md') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ai-coding-report
          path: ai-coding-report.md
          retention-days: 14
